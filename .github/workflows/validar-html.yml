name: Validar HTML

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  html-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar todas las páginas
        run: npx --yes html-validate@11 "*.html"
